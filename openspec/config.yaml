# openspec/config.yaml — brick-draw SDD bootstrap
# Generated by sdd-init on 2026-06-01
schema: spec-driven

context: |
  Tauri 2 desktop drawing app. Rust backend (tiny-skia + wgpu), React 19 + Vite 7 + TypeScript 5.8 + Tailwind CSS 4 + Zustand 5 frontend.
  Architecture: Arc<RwLock<AppState>> shared state, Tauri commands by domain, tauriService.ts infrastructure adapter, Zustand 3-slice store.
  Type sync: ts-rs 8.1 auto-generates TypeScript types from Rust structs.
  Package manager: pnpm. Branch: AjusteV1.0.1.

strict_tdd: true

testing:
  backend:
    runner: cargo test
    framework: Rust built-in (cargo test)
    unit: true
    integration: true
    e2e: false
    coverage: false
  frontend:
    runner: none
    framework: ViTest (planned, not yet configured)
    unit: false
    integration: false
    e2e: false
    coverage: false
  typecheck:
    runner: tsc --noEmit
    strict: true
  linter: none
  formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
    - Document edge cases before implementation
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Mark resilience and idempotency tests as required for every feature/fix
  apply:
    - Follow existing code patterns (Rust domain commands, Zustand slices, tauriService adapter)
    - Frontend tests not yet available; manual verification required until ViTest is configured
    tdd: true
    test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
  verify:
    test_command: "cargo test --manifest-path src-tauri/Cargo.toml"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Merge to AjusteV1.0.1 only after full agent review + user approval
